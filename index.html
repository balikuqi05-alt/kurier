<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kurier">
  <title>Kurier</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="hl"><img class="hlogo" src="subito-logo.png" alt="Subito"><h1 id="title">Tour</h1></div>
    <span id="net" class="net"></span>
  </header>

  <main>
    <section id="view-tour" class="view active" aria-label="Tour"></section>
    <section id="view-karte" class="view" aria-label="Karte">
      <div id="map"></div>
      <div id="pickbar" class="pickbar" hidden></div>
      <div id="mapStyles" class="seg">
        <button type="button" data-style="3D">3D</button>
        <button type="button" data-style="Satellit">Satellit</button>
        <button type="button" data-style="Schweiz">Schweiz</button>
      </div>
      <div class="mapctl">
        <button class="fab" id="btnMe" type="button" aria-label="Meine Position">◎</button>
        <button class="fab" id="btnFit" type="button" aria-label="Ganze Tour zeigen">⤢</button>
      </div>
    </section>
    <section id="view-kunden" class="view" aria-label="Kunden"></section>
    <section id="view-schicht" class="view" aria-label="Schicht"></section>
    <section id="view-einst" class="view" aria-label="Einstellungen"></section>
  </main>

  <nav class="tabs" aria-label="Navigation">
    <button data-view="tour" class="on" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Tour</button>
    <button data-view="karte" type="button"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Karte</button>
    <button data-view="kunden" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Kunden</button>
    <button data-view="schicht" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Schicht</button>
    <button data-view="einst" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Mehr</button>
  </nav>

  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
