<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Subito">
  <meta name="robots" content="noindex, nofollow">
  <title>Subito</title>
  <link rel="manifest" href="manifest.webmanifest?v=8">
  <link rel="icon" href="icon-192.png?v=8" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="style.css?v=13">
  <!-- Karte: swisstopo (aktuelles Luftbild, offizielle Daten des Bundes) mit MapLibre -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>

  <main>
    <!-- KARTE = Startbildschirm -->
    <section id="view-karte" class="view active" aria-label="Karte">
      <div id="map"></div>
      <div class="topbar">
        <form id="mapSearch" class="search" autocomplete="off">
          <img class="s-logo" src="subito-logo.png" alt="Subito">
          <input id="mapQ" type="search" placeholder="Adresse suchen…" enterkeyhint="search" aria-label="Adresse suchen">
        </form>
        <button id="gpsPill" class="gps" type="button" aria-label="GPS-Status"><span class="g-dot"></span><span class="g-txt">GPS</span></button>
      </div>
      <div id="mapResults" class="results" hidden></div>
      <div id="pickbar" class="pickbar" hidden></div>
      <div id="card" class="card-sheet"></div>
    </section>

    <section id="view-liste" class="view" aria-label="Liste"></section>
    <section id="view-schicht" class="view" aria-label="Kasse"></section>
    <section id="view-kunden" class="view" aria-label="Kunden"></section>
    <section id="view-einst" class="view" aria-label="Mehr"></section>
  </main>

  <!-- Navigation: Karte · Liste · 📷 · Kasse · Mehr -->
  <nav class="dock" aria-label="Navigation">
    <button data-view="karte" class="on" type="button"><i class="ph-bold ph-map-trifold"></i>Karte</button>
    <button data-view="liste" type="button"><i class="ph-bold ph-list-bullets"></i>Liste<b class="badge" id="badge" hidden></b></button>
    <button id="btnCam" class="cam-btn" type="button" aria-label="Zettel fotografieren"><i class="ph-fill ph-camera"></i></button>
    <button data-view="schicht" type="button"><i class="ph-bold ph-wallet"></i>Kasse</button>
    <button data-view="einst" type="button"><i class="ph-bold ph-dots-three-circle"></i>Mehr</button>
  </nav>

  <!-- KAMERA direkt in der App: antippen = Foto, kein „Foto benutzen“ -->
  <div id="cam" class="cam" hidden>
    <video id="camVideo" playsinline muted autoplay></video>
    <div class="cam-frame"><span></span></div>
    <div id="camFlash" class="cam-flash"></div>
    <div class="cam-top">
      <button id="camClose" class="cam-ic" type="button" aria-label="Schliessen">✕</button>
      <span id="camHint" class="cam-hint">Zettel ins Feld halten · antippen</span>
      <button id="camTorch" class="cam-ic" type="button" aria-label="Licht" hidden>🔦</button>
    </div>
    <div class="cam-bottom">
      <div id="camThumbs" class="thumbs"></div>
      <div class="cam-ctrl">
        <label class="cam-ic lib" aria-label="Aus Fotos">🖼️<input id="camLib" type="file" accept="image/*" multiple hidden></label>
        <button id="camShot" class="shutter" type="button" aria-label="Foto"></button>
        <button id="camDone" class="cam-done" type="button">Fertig</button>
      </div>
    </div>
  </div>
  <input id="camFallback" type="file" accept="image/*" capture="environment" hidden>

  <!-- Sperrbildschirm (PIN) -->
  <div id="lock" class="lock" hidden></div>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="products.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
