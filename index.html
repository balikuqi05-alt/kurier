<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121519">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kurier">
  <title>Kurier</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Tour</h1>
    <span id="net" class="net"></span>
  </header>

  <main>
    <section id="view-tour" class="view active" aria-label="Tour"></section>
    <section id="view-karte" class="view" aria-label="Karte">
      <div id="map"></div>
      <div id="pickbar" class="pickbar" hidden></div>
      <div class="mapctl">
        <button class="fab" id="btnMe" type="button" aria-label="Meine Position">◎</button>
        <button class="fab" id="btnFit" type="button" aria-label="Ganze Tour zeigen">⤢</button>
      </div>
    </section>
    <section id="view-kunden" class="view" aria-label="Kunden"></section>
    <section id="view-schicht" class="view" aria-label="Schicht"></section>
    <section id="view-einst" class="view" aria-label="Einstellungen"></section>
  </main>

  <nav class="tabs" aria-label="Navigation">
    <button data-view="tour" class="on" type="button"><span>🛵</span>Tour</button>
    <button data-view="karte" type="button"><span>🗺️</span>Karte</button>
    <button data-view="kunden" type="button"><span>👤</span>Kunden</button>
    <button data-view="schicht" type="button"><span>💰</span>Schicht</button>
    <button data-view="einst" type="button"><span>⚙️</span>Mehr</button>
  </nav>

  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
